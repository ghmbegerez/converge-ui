name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

      - name: Type check (mypy)
        run: mypy src/converge_ui/

      - name: Test with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=converge_ui --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=68

      - name: Verify lock file is up-to-date
        run: |
          pip install pip-tools
          pip-compile --strip-extras --extra=dev --output-file=/tmp/requirements.check pyproject.toml
          diff -q requirements.lock /tmp/requirements.check || \
            echo "::warning::requirements.lock is out of date — run: pip-compile --strip-extras --extra=dev -o requirements.lock pyproject.toml"

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit

      - name: Install bandit
        run: pip install bandit

      - name: SAST scan (bandit)
        run: bandit -r src/converge_ui/ -ll -ii

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Audit npm dependencies
        run: cd frontend && npm audit --audit-level=high

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npx eslint src/

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install backend for E2E
        run: pip install -e ".[dev]"
        working-directory: .

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true
          CONVERGE_UI_DATA_MODE: demo
          CONVERGE_UI_AUTH_REQUIRED: "0"
