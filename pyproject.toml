[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "converge-ui"
version = "0.3.0"
description = "Control plane UI backend for converge + converge-orchestrator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn>=0.30.0,<1",
  "httpx>=0.27.0,<1",
  "pydantic>=2.8.0,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=4.0,<6",
  "ruff>=0.9,<1",
  "mypy>=1.10,<2",
  "bandit>=1.7,<2",
]

[project.scripts]
converge-ui = "converge_ui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
converge_ui = ["web/index.html", "web/app.js", "web/styles.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.coverage.run]
source = ["converge_ui"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
